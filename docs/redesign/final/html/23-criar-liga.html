<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar liga</title><link rel="stylesheet" href="../style.css"></head><body><div class="app"><main class="body "><div class="tb"><button class="back"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M15 5l-7 7 7 7"/></svg>Voltar</button><h2>Criar liga</h2></div>
  <div class="field"><label>Nome da liga</label><div class="inp  foc">Liga dos Amigos</div></div>

  <button class="btn p block"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M4 12l5 5L20 6"/></svg>Criar liga</button></main></div><script src="../mock.js"></script></body></html>
