<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabloide · Menu inicial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tabloide.css"></head>
<body class="tabloide"><div class="app">
  <div class="banner pwa"><span>Há uma versão nova do jogo.</span><button class="btn mini">Atualizar</button></div>
  <header class="hero-logo">
    <div class="logo-mark" aria-hidden="true"><svg class="ic" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/></svg></div>
    <h1>Meu Manager</h1>
    <p class="tag">Jogo de técnico de futebol</p>
  </header>
  <main class="stack">
    <section class="card continue">
      <div class="eyebrow">Continuar</div>
      <div class="slot"><svg class="crest" width="52" height="52" viewBox="0 0 64 66" aria-hidden="true"><path d="M32 4 58 12v20c0 14-10 24-26 30C16 56 6 46 6 32V12z" fill="#12356b" stroke="rgba(0,0,0,.35)" stroke-width="2"/><path d="M6 30h52v10H6z" fill="#f2b705" opacity=".95"/><text x="32" y="38.5" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="12" fill="#12356b">IMP</text></svg><div class="slot-t"><b>Imperial FC</b><small>Série A · Temporada 2026 · Rodada 14</small><small>6º lugar · salvo há 2 min</small></div><span class="chip ok"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 11a3.5 3.5 0 0 1 0 7z"/></svg> Na nuvem</span></div>
      <button class="btn primary big full"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg> Continuar</button>
    </section>
    <div class="grid2">
      <button class="btn secondary">Novo jogo</button>
      <button class="btn secondary">Carregar</button>
    </div>
    <button class="btn secondary full">Novo jogo com pacote de dados</button>
    <div class="grid2">
      <button class="btn secondary">Editor</button>
      <button class="btn secondary">Importar save</button>
    </div>
    <button class="note-strip" type="button"><span>Guarde o seu código de recuperação: sem ele, trocar de aparelho faz perder a conta.</span><b>Ver</b></button>
    <section class="card online">
      <div class="eyebrow">Online</div>
      <div class="acct"><svg class="ic" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg><div><b>Treinador_Zé</b><small>Conta online · criada em 03/09/2026</small></div></div>
      <div class="list-btns">
        <button class="row-btn">Ligas online <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        <button class="row-btn">Saves na nuvem (2 de 3) <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        <button class="row-btn">Código de recuperação <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        <button class="row-btn">Dados e conta <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <p class="small">Sem conta? <u>Criar minha conta online</u> · <u>Entrar com o código de recuperação</u></p>
    </section>
    <div class="grid2">
      <button class="btn ghost">Créditos e avisos</button>
      <button class="btn ghost">Relatar problema</button>
    </div>
  </main></div><script src="../mock.js"></script></body></html>
