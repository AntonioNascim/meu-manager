# API do Meu Manager (Fase 6). `database_id` é preenchido na publicação (veja server/LEIAME.md); não é segredo, mas é da conta.
name = "meu-manager-api"
main = "worker.ts"
compatibility_date = "2026-10-01"

[vars]
# Páginas autorizadas a chamar a API (CORS): o site no GitHub Pages e o servidor de desenvolvimento.
ALLOWED_ORIGINS = "https://antonionascim.github.io,http://localhost:5173,http://localhost:4173"

[[d1_databases]]
binding = "DB"
database_name = "meu-manager"
database_id = "SUBSTITUIR-NA-PUBLICACAO"
migrations_dir = "migrations"

# Pacotes de dados do jogo (Fase 6, B3): precisa do bucket criado antes da publicação (wrangler r2 bucket create meu-manager-pacotes).
[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "meu-manager-pacotes"

[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Guard"]

# Saves na nuvem (Fase 6, B4): bucket PRIVADO (sem domínio público, sem r2.dev). Só o Worker lê e grava, depois de conferir a assinatura.
[[r2_buckets]]
binding = "SAVES"
bucket_name = "meu-manager-saves"

# Sem tarefa agendada de limpeza por falta de uso (decisão de 04/11/2026): o jogo não tem e-mail, então não há como avisar quem sumiu, e
# apagar sem aviso está fora de questão. Hoje a conta só é apagada por quem a possui ("Apagar minha conta"). Ver docs/fase6-proposta.md, seção 15.
