name = "lab-meumanager-liga"
main = "src/liga-real.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "LAB"
class_name = "LabLeague"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LabLeague"]

# Só leitura: o pacote real publicado.
[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "meu-manager-pacotes"
